name: Construire l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Copier les bibliothèques (PDF + OCR)
        run: npm run libs

      - name: Numéro de version (pour les mises à jour automatiques)
        run: |
          echo '{"build":${{ github.run_number }},"version":"1.0.${{ github.run_number }}","repo":"${{ github.repository }}"}' > www/version.json
          cat www/version.json

      - name: Générer le projet Android
        run: npx cap add android

      - name: Appliquer le numéro de version à l'APK
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Signature fixe (indispensable pour installer les mises à jour par-dessus)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Synchroniser
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk correcteur-copies.apk

      - name: Publier une Release GitHub (utilisée par la mise à jour automatique)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Version 1.0.${{ github.run_number }}
          body: Nouvelle version du Correcteur de copies. Installez l'APK ou laissez l'application vous proposer la mise à jour.
          files: correcteur-copies.apk
          make_latest: true

      - name: Conserver aussi l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: correcteur-copies-apk
          path: correcteur-copies.apk
